<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <style>
    @font-face { font-family: "Schibsted Grotesk"; src: url(fonts/schibsted-grotesk-latin.woff2) format("woff2"); font-weight: 400 900; font-display: swap; }
    @font-face { font-family: "Newsreader"; src: url(fonts/newsreader-latin.woff2) format("woff2"); font-weight: 200 800; font-display: swap; }
    body { width: 288px; margin: 0; padding: 18px; background: #faf7f0; font-family: "Schibsted Grotesk", system-ui, -apple-system, "Segoe UI", sans-serif; color: #13261f; }
    .logo { font-family: "Newsreader", Georgia, serif; font-size: 22px; font-weight: 600; letter-spacing: -.01em; margin-bottom: 16px; }
    label { font-size: 11px; font-weight: 600; color: #617068; text-transform: uppercase; letter-spacing: .06em; display: block; margin-bottom: 4px; }
    input, select { width: 100%; border: 1px solid #e6dfcf; border-radius: 8px; background: #fff; color: #13261f; padding: 9px 10px; font-size: 13px; margin-bottom: 12px; outline: none; font-family: inherit; box-sizing: border-box; }
    input:focus, select:focus { border-color: #1f5c45; box-shadow: 0 0 0 3px #e7f0ea; }
    button { width: 100%; padding: 10px; background: #1f5c45; color: #fff; border: none; border-radius: 8px; font-size: 13px; font-weight: 600; font-family: inherit; cursor: pointer; }
    button:hover { background: #174a37; }
    .saved { color: #1f5c45; font-size: 12px; text-align: center; margin-top: 8px; display: none; }
    .upgrade { margin-top: 12px; text-align: center; font-size: 12px; color: #617068; }
    .upgrade a { color: #1f5c45; }
  </style>
</head>
<body>
  <div class="logo">ReviewReply</div>

  <label for="license">License key (paid plans)</label>
  <input type="text" id="license" placeholder="From your Gumroad receipt" autocomplete="off" spellcheck="false">

  <label for="tone">Default tone</label>
  <select id="tone">
    <option value="friendly">Friendly</option>
    <option value="professional">Professional</option>
    <option value="witty">Witty</option>
    <option value="empathetic">Empathetic</option>
  </select>

  <button id="saveBtn" type="button">Save settings</button>
  <div class="saved" id="saved">Saved.</div>

  <div class="upgrade">
    <a href="https://www.reviewreply.store/#pricing" target="_blank" rel="noopener">Paid plans reply to reviews of any length</a>
  </div>

  <script src="popup.js"></script>
</body>
</html>
